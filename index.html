<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Pomodoro</title>
    <style>
      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #080511;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Display", "Segoe UI", Roboto, system-ui, sans-serif;
      }

      /* Preloader inicial exibido instantaneamente no frame 0 */
      .initial-splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        background-color: #080511;
      }

      .spinner-ring {
        position: relative;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        border: 4px solid rgba(139, 92, 246, 0.15);
        border-top-color: #a855f7;
        border-right-color: #7c3aed;
        animation: spin 0.8s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
        box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
      }

      .inner-icon {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: radial-gradient(circle, #c084fc 0%, #7c3aed 100%);
        box-shadow: 0 0 15px rgba(168, 85, 247, 0.8);
      }

      .splash-label {
        margin-top: 24px;
        font-family: "Cascadia Code", "Consolas", monospace;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: #ffffff;
        text-shadow: 0 0 12px rgba(168, 85, 247, 0.6);
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="text-white select-none overflow-hidden m-0 p-0 antialiased">
    <div id="root">
      <div class="initial-splash">
        <div style="position: relative; width: 80px; height: 80px;">
          <div class="spinner-ring"></div>
          <div class="inner-icon"></div>
        </div>
        <div class="splash-label">Neon Pomodoro</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
